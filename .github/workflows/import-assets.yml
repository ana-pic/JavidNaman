name: Import image archives
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - name: Download and reconstruct archives
        shell: bash
        run: |
          set -euo pipefail
          curl -X POST -fL --retry 3 'https://mcp.sentinelx.app/files/d/npDiqsIUjFb5AnYM5HsaYnCKsqQ7PYnIE9pad76dO5g' -o /tmp/yademan.part00
          curl -X POST -fL --retry 3 'https://mcp.sentinelx.app/files/d/o4xANuDUYiE83bDVre6MjYp1sNKZQZB9pk2En9Ue2CM' -o /tmp/yademan.part01
          cat /tmp/yademan.part00 /tmp/yademan.part01 > yademan-images.zip
          curl -X POST -fL --retry 3 'https://mcp.sentinelx.app/files/d/S96OGZNnsiZzWeyjxyGihteoNmqIqW_yQRPFfoYYn8I' -o yademan-images-webp95.zip
          test "$(stat -c%s yademan-images.zip)" = "548088064"
          test "$(stat -c%s yademan-images-webp95.zip)" = "417858734"
      - name: Extract into flat top-level folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/extract-original /tmp/extract-webp
          unzip -q yademan-images.zip -d /tmp/extract-original
          unzip -q yademan-images-webp95.zip -d /tmp/extract-webp
          test -d /tmp/extract-original/yademan-images
          test -d /tmp/extract-webp/yademan-images-webp95
          mv /tmp/extract-original/yademan-images ./yademan-images
          mv /tmp/extract-webp/yademan-images-webp95 ./yademan-images-webp95
          echo "Original files: $(find yademan-images -type f | wc -l)"
          echo "WebP files: $(find yademan-images-webp95 -type f | wc -l)"
      - name: Commit archives and extracted folders
        run: |
          set -euo pipefail
          git lfs install
          git lfs track '*.zip'
          git add .gitattributes yademan-images.zip yademan-images-webp95.zip yademan-images/ yademan-images-webp95/
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Extract Yademan image archives into repository folders'
          git push origin HEAD:main

