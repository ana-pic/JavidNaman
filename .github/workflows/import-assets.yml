name: Import image archives
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - name: Download and reconstruct archives
        shell: bash
        run: |
          set -euo pipefail
          curl -X POST -fL --retry 3 'https://mcp.sentinelx.app/files/d/0tgT7NkRuvs5yHYn-nHreyVHCw-wisrf9umlElvq-6E' -o /tmp/yademan.part00
          curl -X POST -fL --retry 3 'https://mcp.sentinelx.app/files/d/RQ-ukmwIu-V4rQoa1pLdPPpydUiDuP8pD_K16ZGW818' -o /tmp/yademan.part01
          cat /tmp/yademan.part00 /tmp/yademan.part01 > yademan-images.zip
          curl -X POST -fL --retry 3 'https://mcp.sentinelx.app/files/d/RXgB0RTjAMi9tGQDqrT-P0jWnhgE04jYuz-M9K6-BYg' -o yademan-images-webp95.zip
          test "$(stat -c%s yademan-images.zip)" = "548088064"
          test "$(stat -c%s yademan-images-webp95.zip)" = "417858734"
      - name: Commit archives with Git LFS
        run: |
          set -euo pipefail
          git lfs install
          git lfs track '*.zip'
          git add .gitattributes yademan-images.zip yademan-images-webp95.zip
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add Yademan image archives via Git LFS'
          git push origin HEAD:main
