name: Generate WebP image variants

on:
  push:
    branches: [perf/generate-image-variants]
  pull_request:
    branches: [main]
    paths:
      - "scripts/generate-image-variants.py"
      - ".github/workflows/generate-image-variants.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-image-variants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/perf/generate-image-variants' || github.event.pull_request.head.ref == 'perf/generate-image-variants'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Generate and validate variants
        run: python scripts/generate-image-variants.py

      - name: Commit generated assets to the branch
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yademan-thumbnails-webp yademan-medium-webp yademan-image-variants.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate thumbnail and medium WebP variants"
            git push origin "HEAD:${BRANCH_NAME}"
          else
            echo "Generated variants are already up to date."
          fi
